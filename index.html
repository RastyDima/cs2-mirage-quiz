<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS2 Mirage — Угадай позицию</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#293452,#0d111d 75%);color:white;font-family:system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(780px,100%);background:#171e30;border:1px solid #36415b;border-radius:24px;padding:24px;box-shadow:0 18px 70px #0008}h1{margin:4px 0 8px;font-size:clamp(24px,5vw,36px)}p{color:#b8c2d9}.top{display:flex;justify-content:space-between;color:#b9c7e9;font-weight:700}.bar{height:8px;background:#34415e;border-radius:8px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#8a5cf6}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#111}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.answers button{border:0;border-radius:12px;min-height:64px;padding:14px;color:white;font-size:17px;font-weight:800;cursor:pointer;text-align:left}.answers button:nth-child(1){background:#e33a50}.answers button:nth-child(2){background:#2871e6}.answers button:nth-child(3){background:#d49b10}.answers button:nth-child(4){background:#209b65}button:disabled{opacity:.65;cursor:default}.answers button.correct{outline:4px solid #fff;opacity:1}.primary{border:0;background:#8955f6;color:white;font-size:19px;font-weight:800;border-radius:12px;padding:15px 26px;cursor:pointer}.center{text-align:center;padding:35px 8px}.timer{font-size:23px;font-weight:900;color:#ffc764}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.small{font-size:12px;color:#9aa9c5}@media(max-width:500px){.card{padding:15px}.answers{gap:8px}.answers button{font-size:14px;padding:10px;min-height:70px}}</style><main class="card" id="app"></main><script>const questions=[{"image":"images/question_01.jpg","answers":["Дефолт","Тройка","Тетрис","Фаербокс"],"correct":0},{"image":"images/question_02.jpg","answers":["Фаербокс","Тетрис","Ниндзя","Дефолт"],"correct":0},{"image":"images/question_03.jpg","answers":["Тройка","Сэндвич","Ниндзя","Дефолт"],"correct":0},{"image":"images/question_04.jpg","answers":["Ниндзя","Тетрис","Фаербокс","Сэндвич"],"correct":0},{"image":"images/question_05.jpg","answers":["Палас","Рампа","Стейрс","Балкон"],"correct":0},{"image":"images/question_06.jpg","answers":["Рампа","Палас","Андер","Коннектор"],"correct":0},{"image":"images/question_07.jpg","answers":["Стейрс","Тикет","Рампа","Балкон"],"correct":0},{"image":"images/question_08.jpg","answers":["Тикет","Стейрс","Коннектор","Джангл"],"correct":0},{"image":"images/question_09.jpg","answers":["Джангл","Коннектор","Окно","Шорт"],"correct":1},{"image":"images/question_10.jpg","answers":["Коннектор","Джангл","Шорт","Ладдер"],"correct":0},{"image":"images/question_11.jpg","answers":["Окно","Шорт","Апартаменты","Маркет"],"correct":0},{"image":"images/question_12.jpg","answers":["Шорт","Окно","Коннектор","Мид"],"correct":0},{"image":"images/question_13.jpg","answers":["Андер","Ладдер","Коннектор","Б мейн"],"correct":0},{"image":"images/question_14.jpg","answers":["Ладдер","Андер","Апартаменты","Окно"],"correct":0},{"image":"images/question_15.jpg","answers":["Апартаменты","Кухня","Б мейн","Маркет"],"correct":0},{"image":"images/question_16.jpg","answers":["Топ Мид","Мид","Коннектор","Шорт"],"correct":1},{"image":"images/question_17.jpg","answers":["Б плент","Машина","Маркет","Апартаменты"],"correct":0},{"image":"images/question_18.jpg","answers":["Маркет","Б Апс","Кухня","Машина"],"correct":3},{"image":"images/question_19.jpg","answers":["Кухня","Маркет","Б мейн","Апартаменты"],"correct":0},{"image":"images/question_20.jpg","answers":["Машина","Б плент","Маркет","Б Апс"],"correct":0}];let index=0,score=0,correctCount=0,remaining=15,interval=null,locked=false;const app=document.querySelector('#app');function start(){index=0;score=0;correctCount=0;show()}function show(){clearInterval(interval);locked=false;remaining=15;let q=questions[index];app.innerHTML=`<div class="top"><span>MIRAGE • ${index+1}/20</span><span>⭐ ${score} очков</span></div><div class="bar"><div class="fill" style="width:${index*5}%"></div></div><h1>Угадай позицию</h1><div class="top"><span>Как называется это место?</span><span class="timer" id="timer">15 сек.</span></div><img class="photo" src="${q.image}" alt="Позиция на Mirage"><div class="answers">${q.answers.map((a,i)=>`<button onclick="answer(${i})">${'ABCD'[i]} · ${a}</button>`).join('')}</div><div class="foot"><span id="status" class="small">Выбери один ответ до конца времени</span><button class="primary" id="next" hidden onclick="next()">Дальше →</button></div>`;interval=setInterval(()=>{remaining--;document.getElementById('timer').textContent=remaining+' сек.';if(remaining<=0)answer(-1)},1000)}function answer(n){if(locked)return;locked=true;clearInterval(interval);let q=questions[index],buttons=[...document.querySelectorAll('.answers button')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct')});let ok=n===q.correct;if(ok){correctCount++;score+=100+remaining*10}document.getElementById('status').textContent=ok?'✓ Правильно! +'+(100+remaining*10):'✗ Правильный ответ: '+q.answers[q.correct];document.getElementById('next').hidden=false;document.getElementById('next').textContent=index===19?'Результат →':'Дальше →'}function next(){index++;if(index===20){clearInterval(interval);app.innerHTML=`<div class="center"><h1>Матч завершён!</h1><p>Правильных ответов: ${correctCount} из 20</p><h1 style="font-size:54px">${score} ⭐</h1><button class="primary" onclick="start()">Играть снова</button></div>`}else show()}app.innerHTML=`<div class="center"><h1>CS2 MIRAGE</h1><h2>Угадай позицию по картинке</h2><p>20 вопросов · 15 секунд на ответ · 4 варианта</p><button class="primary" onclick="start()">Начать игру →</button><p class="small">Изображения стилизованы под Mirage и могут отличаться от реальной геометрии карты.</p></div>`;</script></html>
